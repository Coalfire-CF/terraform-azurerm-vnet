name: "CI: Terraform docs"

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
      # README.md is generated from these, so a prose-only or config-only
      # edit must run the check too. Without them a stale README ships green.
      - "_header.md"
      - "_footer.md"
      - ".terraform-docs.yml"
  workflow_call:

jobs:
  terraform-docs:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-docs.yml@ff2ce86f31c3ca42c0dcefbd4d3e53a68f99759c # v1.7.0
