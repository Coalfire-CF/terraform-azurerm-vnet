name: "CI: Terraform docs"

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
      # README.md is generated from these, so a prose-only or config-only
      # edit must run the check too. Without them a stale README ships green.
      - "_header.md"
      - "_footer.md"
      - ".terraform-docs.yml"
  workflow_call:

jobs:
  terraform-docs:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-docs.yml@7e2de0438dd4d4d4b302900dd2be9bb16ec276a2 # v1.3.0
