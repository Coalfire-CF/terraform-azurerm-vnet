name: "Automation: Dependabot refresh"

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: Coalfire-CF/Actions/.github/workflows/automation-dependabot-refresh.yml@e833f409d1d1fd8014f3de1efd077785d3dae460 # v1.5.0
    with:
      head_branch: ${{ github.head_ref || github.ref_name }}  # PR head, or current branch if not a PR
      include_github_actions: "true"
      default_interval: "daily"
      depb_path: ".github/dependabot.yml"
      commit_message: "chore: refresh dependabot.yml & TF sources"
