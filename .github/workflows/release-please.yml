name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@ff2ce86f31c3ca42c0dcefbd4d3e53a68f99759c # v1.7.0
    with:
      publish_draft: true
    secrets: inherit
