name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@41c5b9cccbfd5cf474ec38d53676d6f4ec213258 # v1.6.0
    with:
      publish_draft: true
    secrets: inherit
