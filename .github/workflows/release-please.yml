name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@4bf77d63a87f83265d494f008a5ec01bece2b61a # v1.7.1
    with:
      publish_draft: true
    secrets: inherit
