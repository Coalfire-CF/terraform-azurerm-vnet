name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@7e2de0438dd4d4d4b302900dd2be9bb16ec276a2 # v1.3.0
    with:
      publish_draft: true
    secrets: inherit
