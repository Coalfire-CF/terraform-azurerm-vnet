name: "CI: Terraform validate"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"

jobs:
  terraform-validate:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-validate.yml@41c5b9cccbfd5cf474ec38d53676d6f4ec213258 # v1.6.0
    with:
      terraform_version: "1.16.6"
    secrets: inherit
