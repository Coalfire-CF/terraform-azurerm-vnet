name: "CI: Terraform validate"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"

jobs:
  terraform-validate:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-validate.yml@6b75ed76d73064326039a5fd49fc962614c0f65d # v1.1.1
    with:
      terraform_version: "1.13.3"
    secrets: inherit
