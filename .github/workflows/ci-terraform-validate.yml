name: "CI: Terraform validate"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"

jobs:
  terraform-validate:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-validate.yml@4bf77d63a87f83265d494f008a5ec01bece2b61a # v1.7.1
    with:
      terraform_version: "1.16.6"
    secrets: inherit
