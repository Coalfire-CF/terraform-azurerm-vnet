name: "CI: Terraform validate"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"

jobs:
  terraform-validate:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-validate.yml@ff2ce86f31c3ca42c0dcefbd4d3e53a68f99759c # v1.7.0
    with:
      terraform_version: "1.16.6"
    secrets: inherit
