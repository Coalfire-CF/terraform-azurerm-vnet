name: Org Terraform Docs

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
      # README.md is generated from these, so a prose-only or config-only
      # edit must run the check too. Without them a stale README ships green.
      - "_header.md"
      - "_footer.md"
      - ".terraform-docs.yml"
  workflow_call:

jobs:
  terraform-docs:
    uses: Coalfire-CF/Actions/.github/workflows/org-terraform-docs.yml@43274fdf0406920dfa1e5fd05cac5d8d10951c96 # v0.17.0
